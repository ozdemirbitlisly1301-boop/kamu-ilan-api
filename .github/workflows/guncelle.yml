name: Kamu İlanlarını Güncelle

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kütüphaneleri Kur
        run: |
          pip install requests beautifulsoup4

      - name: Güncelleyiciyi Çalıştır
        run: |
          python guncelle.py

      - name: Değişiklikleri Kaydet
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ilanlar.json
          git diff --cached --quiet || git commit -m "İlanlar güncellendi"
          git push
