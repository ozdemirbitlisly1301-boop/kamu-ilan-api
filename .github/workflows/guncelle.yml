name: Kamu İlanlarını Güncelle

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kütüphaneleri kur
        run: |
          pip install requests beautifulsoup4 pypdf

      - name: İlanları ve PDF bilgilerini çek
        run: |
          python guncelle.py

      - name: JSON dosyasını kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ilanlar.json
          git diff --cached --quiet || git commit -m "İlanlar ve filtre bilgileri güncellendi"
          git push
